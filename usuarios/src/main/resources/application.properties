spring.application.name=Usuarios
server.port=${PORT:8082}

# Conexión a PostgreSQL (cada valor se puede reemplazar con una variable de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dbusuarios}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT: este micro emite los tokens (el issuer debe ser igual en los tres micros)
app.issuer=${JWT_ISSUER:losmaestros-usuarios}
# Carpeta de la llave RSA (se crea sola)
app.keys-directory=${KEYS_DIRECTORY:./data/keys}
# Vigencia del token en minutos (el frontend lo renueva con /api/auth/refresh)
app.token-minutos=${TOKEN_MINUTOS:30}
