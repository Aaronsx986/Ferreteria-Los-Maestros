  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>

<script>
  const USERS_SEED = {"users": [{"username": "admin", "password": "admin123", "role": "admin", "name": "Administrador Principal", "email": "admin@ferreterialosmaestros.cl", "phone": "+56912345678", "address": {"street": "Av. Principal 123", "city": "Santiago", "country": "Chile"}, "preferences": {"notifications": true, "newsletter": true, "theme": "dark"}, "stats": {"totalPurchases": 15, "totalSpent": 3250000, "memberSince": "2024-01-01", "lastLogin": "2025-11-11T10:30:00Z"}, "status": "active", "created": "2024-01-01T00:00:00Z", "updated": "2025-11-11T10:30:00Z"}, {"username": "usuario", "password": "user123", "role": "user", "name": "Cliente Ejemplo", "email": "usuario@ferreterialosmaestros.cl", "phone": "+56987654321", "address": {"street": "Calle Secundaria 456", "city": "Valparaíso", "country": "Chile"}, "preferences": {"notifications": true, "newsletter": false, "theme": "light"}, "stats": {"totalPurchases": 3, "totalSpent": 650000, "memberSince": "2024-02-15", "lastLogin": "2025-11-10T15:45:00Z"}, "status": "active", "created": "2024-02-15T00:00:00Z", "updated": "2025-11-10T15:45:00Z"}], "roles": {"admin": {"permissions": ["users:read", "users:write", "users:delete", "products:read", "products:write", "products:delete", "sales:read", "sales:write", "reports:read", "reports:generate", "settings:read", "settings:write"], "description": "Acceso completo al sistema"}, "user": {"permissions": ["products:read", "cart:read", "cart:write", "purchases:read", "profile:read", "profile:write"], "description": "Cliente con acceso básico"}, "seller": {"permissions": ["products:read", "products:write", "sales:read", "sales:write", "customers:read", "reports:read"], "description": "Vendedor con acceso a gestión comercial"}}};

  function roleBadge(r) {
    return r === 'admin'
      ? '<span class="badge text-bg-dark"><i class="bi bi-shield-lock"></i> Administrador</span>'
      : '<span class="badge text-bg-light border">Cliente</span>';
  }

  function getUsersList() {
    let list = USERS_SEED.users || USERS_SEED;
    if (!Array.isArray(list)) list = [];
    return list;
  }

  function renderUsers() {
    const q = document.getElementById('userSearch').value.toLowerCase();
    const users = getUsersList().filter(u => !q || (u.name || u.username || '').toLowerCase().includes(q) || (u.email || '').toLowerCase().includes(q));

    document.getElementById('usersTable').innerHTML = users.length ? users.map(u =>
      '<tr><td>' + (u.name || u.username) + '</td><td>' + (u.email || '-') + '</td><td>' + roleBadge(u.role) + '</td>' +
      '<td><span class="badge text-bg-success">Activo</span></td>' +
      '<td><button class="btn btn-sm btn-outline-flm" onclick="alert(\'Editar usuario (próximamente).\')"><i class="bi bi-pencil"></i></button></td></tr>'
    ).join('') : '<tr><td colspan="5" class="text-center text-muted py-4">No hay usuarios registrados.</td></tr>';

    const total = users.length;
    document.getElementById('totalUsers').textContent = total;
    document.getElementById('totalClients').textContent = users.filter(u => u.role !== 'admin').length;
    document.getElementById('totalAdmins').textContent = users.filter(u => u.role === 'admin').length;
    document.getElementById('newUsers').textContent = Math.max(1, Math.round(total * 0.15));
  }

  document.addEventListener('DOMContentLoaded', function () {
    flmRequireAdmin();
    document.getElementById('userSearch').addEventListener('input', renderUsers);
    renderUsers();
  });
</script>
