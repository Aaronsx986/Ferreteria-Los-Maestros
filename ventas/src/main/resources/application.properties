spring.application.name=RegistroVentas
server.port=${PORT:8083}

# Conexión a PostgreSQL (cada valor se puede reemplazar con una variable de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dbregistroventas}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT emitido por el micro de usuarios (mismo issuer en los tres micros)
app.issuer=${JWT_ISSUER:losmaestros-usuarios}
app.jwks=${AUTH_JWKS_URL:http://localhost:8082/api/auth/jwks}

# URL directa del micro de productos (no pasa por el gateway)
catalogo.url=${CATALOGO_URL:http://localhost:8081}
# Clave compartida con productos para /internal/**
app.internal-key=${INTERNAL_API_KEY:local-cambiar-clave-interna}
