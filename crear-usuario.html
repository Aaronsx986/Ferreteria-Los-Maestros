<head>
  <meta charset="UTF-8">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link href="css/styles.css" rel="stylesheet">
</head>
<body>

  <hr class="mt-auto">
  <ul class="nav flex-column pb-3">
    <li class="nav-item"><a class="nav-link" href="index.html"><i class="bi bi-shop"></i> Volver a la tienda</a></li>
    <li class="nav-item"><a class="nav-link" href="#" data-flm-logout><i class="bi bi-box-arrow-right"></i> Cerrar sesión</a></li>
  </ul>
</div>
  <div class="flex-grow-1 d-flex flex-column">
<div class="flm-admin-topbar d-flex align-items-center justify-content-between">
  <div class="d-flex align-items-center gap-2">
    <button class="btn btn-sm btn-outline-secondary d-lg-none" data-flm-sidebar-toggle><i class="bi bi-list"></i></button>
    <h5 class="mb-0 fw-bold">Crear Usuario</h5>
  </div>
  <div class="d-flex align-items-center gap-2">
    <span class="text-muted small">Hola, <strong id="flmNavUserName">—</strong></span>
    <a href="index.html" class="btn btn-sm btn-outline-flm"><i class="bi bi-shop"></i> Tienda</a>
  </div>
</div>
    <div class="flm-admin-content bg-flm-gray flex-grow-1">
<div class="flm-card p-4" style="max-width:640px;">
  <h5 class="fw-bold mb-3">Nuevo usuario</h5>
  <form class="row g-3" id="newUserForm">
    <div class="col-md-6"><label class="form-label small fw-semibold">Nombre completo</label><input type="text" class="form-control" id="nuName" required></div>
    <div class="col-md-6"><label class="form-label small fw-semibold">Correo electrónico</label><input type="email" class="form-control" id="nuEmail" required></div>
    <div class="col-md-6"><label class="form-label small fw-semibold">Usuario</label><input type="text" class="form-control" id="nuUsername" required></div>
    <div class="col-md-6"><label class="form-label small fw-semibold">Teléfono</label><input type="tel" class="form-control" id="nuPhone" placeholder="+56 9 1234 5678"></div>
    <div class="col-md-6"><label class="form-label small fw-semibold">Contraseña</label><input type="password" class="form-control" id="nuPassword" required></div>
    <div class="col-md-6">
      <label class="form-label small fw-semibold">Rol</label>
      <select class="form-select" id="nuRole" required>
        <option value="user">Cliente</option>
        <option value="admin">Administrador</option>
      </select>
    </div>
    <div class="col-12"><label class="form-label small fw-semibold">Dirección</label><input type="text" class="form-control" id="nuAddress" placeholder="Calle, número, comuna"></div>
  </form>
  <div class="alert alert-success mt-3 d-none" id="nuSuccess">Usuario creado exitosamente.</div>
  <div class="d-flex gap-2 mt-3">
    <button class="btn btn-flm" onclick="createUser()"><i class="bi bi-check-circle"></i> Crear usuario</button>
    <a href="usuarios.html" class="btn btn-outline-secondary">Cancelar</a>
  </div>
</div>
    </div>
  </div>
</div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>

<script>
  function createUser() {
    const name = document.getElementById('nuName').value.trim();
    const email = document.getElementById('nuEmail').value.trim();
    const username = document.getElementById('nuUsername').value.trim();
    const password = document.getElementById('nuPassword').value;
    if (!name || !email || !username || !password) { alert('Completa todos los campos obligatorios.'); return; }
    document.getElementById('nuSuccess').classList.remove('d-none');
    document.getElementById('newUserForm').reset();
    setTimeout(() => { window.location.href = 'usuarios.html'; }, 1500);
  }

  document.addEventListener('DOMContentLoaded', function () {
    flmRequireAdmin();
  });
</script>
</body>
</html>
