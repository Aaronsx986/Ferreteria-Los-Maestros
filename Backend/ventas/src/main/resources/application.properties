spring.application.name=RegistroVentas
# 8083: productos usa 8081, usuarios 8082 y el gateway 8080
server.port=${PORT:8083}

# PostgreSQL local (en Docker lo reemplazan las variables SPRING_DATASOURCE_* del compose)
spring.datasource.url=jdbc:postgresql://localhost:5432/dbregistroventas
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Micro de productos (catálogo): se llama DIRECTO, sin pasar por el gateway. En Docker: http://productos:8081
catalogo.url=${CATALOGO_URL:http://localhost:8081}
# Clave compartida con productos para /internal/** (debe ser la misma en ambos micros)
app.internal-key=${INTERNAL_API_KEY:local-cambiar-clave-interna}

# JWT emitido por el micro de usuarios (mismo issuer y llaves que usa productos)
app.issuer=${JWT_ISSUER:losmaestros-usuarios}
app.jwks=${AUTH_JWKS_URL:http://localhost:8082/api/auth/jwks}
