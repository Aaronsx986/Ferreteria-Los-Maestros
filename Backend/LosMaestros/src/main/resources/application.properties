spring.application.name=LosMaestros
server.port=8081
spring.datasource.url=jdbc:postgresql://localhost:5432/dblosmaestros
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

app.issuer=${JWT_ISSUER:losmaestros-usuarios}
app.jwks=${AUTH_JWKS_URL:http://localhost:8082/api/auth/jwks}

# Clave compartida con el micro de ventas para /internal/** (debe ser la misma en ambos micros)
app.internal-key=${INTERNAL_API_KEY:local-cambiar-clave-interna}
