spring.application.name=Usuarios
# 8082: productos usa 8081, ventas 8083 y el gateway 8080
server.port=${PORT:8082}

# Cada valor se puede sobreescribir con una variable de entorno; si no existe, se usa el de la derecha.
# En Docker los reemplazan las variables SPRING_DATASOURCE_* del compose.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dbusuarios}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT: este micro EMITE los tokens; productos y ventas los validan con /api/auth/jwks.
# El issuer debe ser el mismo en los tres micros.
app.issuer=${JWT_ISSUER:losmaestros-usuarios}
# Carpeta donde se guarda la llave RSA (se crea sola). En Docker va en un volumen.
app.keys-directory=${KEYS_DIRECTORY:./data/keys}
# Vigencia del token en minutos
app.token-minutos=${TOKEN_MINUTOS:120}
