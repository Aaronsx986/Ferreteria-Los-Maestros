server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: productos
              uri: ${PRODUCTOS_URL:http://localhost:8081}
              predicates:
                - Path=/api/productos/**
            - id: usuarios
              uri: ${USUARIOS_URL:http://localhost:8082}
              predicates:
                - Path=/api/auth/**,/api/usuarios/**
            - id: ventas
              uri: ${VENTAS_URL:http://localhost:8083}
              predicates:
                - Path=/api/ventas/**
