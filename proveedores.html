  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  const SUPPLIERS = [{"id": 1, "name": "Cementos Polpaico S.A.", "contact": {"name": "Rodrigo Álvarez", "email": "ventas@polpaico.cl", "phone": "+56 2 2345 6789", "position": "Jefe de Ventas Zona Centro"}, "address": {"street": "Av. Industrial 890", "city": "Santiago", "region": "Región Metropolitana", "country": "Chile"}, "products": ["cementos", "morteros", "aridos"], "paymentTerms": "30 días", "deliveryTime": "2-4 días hábiles", "rating": 4.8, "status": "active", "since": "2022-03-10", "lastOrder": "2026-08-20", "notes": "Proveedor histórico, despacho directo a bodega central"}, {"id": 2, "name": "Distribuidora Stanley-Bahco Chile", "contact": {"name": "Marcela Torres", "email": "mtorres@stanleybahco.cl", "phone": "+56 2 2765 4321", "position": "Ejecutiva de Cuentas"}, "address": {"street": "Camino a Melipilla 5400", "city": "Santiago", "region": "Región Metropolitana", "country": "Chile"}, "products": ["herramientas-manuales", "herramientas-electricas"], "paymentTerms": "45 días", "deliveryTime": "3-5 días hábiles", "rating": 4.6, "status": "active", "since": "2021-07-22", "lastOrder": "2026-08-25", "notes": "Buenos precios en volumen, exige orden de compra formal"}, {"id": 3, "name": "Makita Herramientas Ltda.", "contact": {"name": "Felipe Rojas", "email": "frojas@makita.cl", "phone": "+56 2 2988 1122", "position": "Gerente Comercial"}, "address": {"street": "Av. Américo Vespucio 1230", "city": "Santiago", "region": "Región Metropolitana", "country": "Chile"}, "products": ["herramientas-electricas"], "paymentTerms": "30 días", "deliveryTime": "5-7 días hábiles", "rating": 4.9, "status": "active", "since": "2023-01-15", "lastOrder": "2026-08-18", "notes": "Garantía extendida en herramientas eléctricas profesionales"}, {"id": 4, "name": "Tigre Chile - Gasfitería y Tuberías", "contact": {"name": "Ignacio Muñoz", "email": "imunoz@tigre.cl", "phone": "+56 2 2456 7890", "position": "Supervisor de Distribución"}, "address": {"street": "Ruta 68 Km 12", "city": "Santiag   function statusBadge(s) {
    const map = { active: ['success', 'Activo'], pending: ['warning', 'Pendiente'], inactive: ['secondary', 'Inactivo'] };
    const [cls, label] = map[s] || ['secondary', s];
    return '<span class="badge text-bg-' + cls + '">' + label + '</span>';
  }

  function starRating(r) {
    let html = '<span class="flm-rating">';
    for (let i = 1; i <= 5; i++) html += '<i class="bi ' + (i <= Math.round(r) ? 'bi-star-fill' : 'bi-star') + '"></i>';
    return html + '</span> <small class="text-muted">' + r + '</small>';
  }

  function supplierCard(s) {
    return '<div class="col-md-6 col-xl-4">' +
      '<div class="flm-card p-3 h-100">' +
        '<div class="d-flex justify-content-between align-items-start mb-2">' +
          '<h6 class="fw-bold mb-0">' + s.name + '</h6>' + statusBadge(s.status) +
        '</div>' +
        '<div class="small text-muted mb-2">' + starRating(s.rating) + '</div>' +
        '<div class="small mb-1"><i class="bi bi-person"></i> ' + s.contact.name + ' — ' + s.contact.position + '</div>' +
        '<div class="small mb-1"><i class="bi bi-envelope"></i> ' + s.contact.email + '</div>' +
        '<div class="small mb-1"><i class="bi bi-telephone"></i> ' + s.contact.phone + '</div>' +
        '<div class="small mb-1"><i class="bi bi-geo-alt"></i> ' + s.address.city + ', ' + s.address.region + '</div>' +
        '<div class="small mb-2"><i class="bi bi-truck"></i> Entrega: ' + s.deliveryTime + ' · Pago: ' + s.paymentTerms + '</div>' +
        '<div class="d-flex flex-wrap gap-1">' + s.products.map(p => '<span class="badge text-bg-light border">' + p + '</span>').join('') + '</div>' +
      '</div>' +
    '</div>';
  }

  function renderSuppliers() {
    const q = document.getElementById('provSearch').value.toLowerCase();
    const list = SUPPLIERS.filter(s => !q || s.name.toLowerCase().includes(q) || s.products.join(' ').toLowerCase().includes(q));
    document.getElementById('suppliersGrid').innerHTML = list.map(supplierCard).join('');
    document.getElementById('totalSuppliers').textContent = SUPPLIERS.length;
    document.getElementById('activeSuppliers').textContent = SUPPLIERS.filter(s => s.status === 'active').length;
    document.getElementById('pendingSuppliers').textContent = SUPPLIERS.filter(s => s.status === 'pending').length;
    const avg = SUPPLIERS.reduce((sum, s) => sum + s.rating, 0) / SUPPLIERS.length;
    document.getElementById('avgRating').textContent = avg.toFixed(1);
  }

  document.addEventListener('DOMContentLoaded', function () {
    flmRequireAdmin();
    document.getElementById('provSearch').addEventListener('input', renderSuppliers);
    renderSuppliers();
  });
</script>
</body>
